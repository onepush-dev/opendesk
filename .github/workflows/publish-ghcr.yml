name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'realtime.Dockerfile', '.github/workflows/publish-ghcr.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/onepush-dev/opendesk:v0.4.7
          platforms: linux/amd64
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: realtime.Dockerfile
          push: true
          tags: ghcr.io/onepush-dev/opendesk-realtime:v0.4.7
          platforms: linux/amd64
